[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Reproducible Azure workload analysis and leakage-safe forecasting"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "nbconvert>=7.16"]
report = ["reportlab>=4.0", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
